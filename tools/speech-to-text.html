<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحويل الصوت إلى نص | يعقوب AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <i class="fas fa-robot"></i>
                يعقوب <span>AI</span>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html">الرئيسية</a></li>
                <li><a href="../dashboard.html">الأدوات</a></li>
                <li><a href="../settings.html">الإعدادات</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <h1><i class="fas fa-microphone"></i> تحويل الصوت إلى نص</h1>
        
        <div class="tool-container" style="max-width: 800px; margin: 2rem auto;">
            <div class="form-group">
                <label>🎤 اختر ملف صوتي:</label>
                <input type="file" id="audioFile" accept="audio/*" onchange="previewAudio(this)">
                <small>الامتدادات المدعومة: MP3, WAV, M4A, OGG (حد أقصى 25MB)</small>
            </div>
            
            <div id="audioPreview" style="display: none; margin-top: 1rem;">
                <audio id="audioPlayer" controls style="width: 100%;"></audio>
            </div>
            
            <div class="form-group" style="margin-top: 1rem;">
                <label>🌐 لغة التسجيل:</label>
                <select id="language">
                    <option value="ar">العربية</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                </select>
            </div>
            
            <button class="btn btn-primary" onclick="convertToText()">
                <i class="fas fa-exchange-alt"></i> تحويل إلى نص
            </button>
            
            <div class="form-group" style="margin-top: 1rem;">
                <label>🎙️ أو سجل مباشرة:</label>
                <button class="btn btn-secondary" onclick="startRecording()" id="recordBtn">
                    <i class="fas fa-circle"></i> بدء التسجيل
                </button>
                <button class="btn btn-secondary" onclick="stopRecording()" id="stopBtn" style="display: none;">
                    <i class="fas fa-stop"></i> إيقاف التسجيل
                </button>
            </div>
            
            <div id="loading" style="display: none; text-align: center; margin-top: 2rem;">
                <div class="spinner"></div>
                <p>جاري تحويل الصوت إلى نص...</p>
            </div>
            
            <div id="result" class="result-box" style="display: none;">
                <h3><i class="fas fa-file-alt"></i> النص المستخرج:</h3>
                <div id="transcribedText" style="white-space: pre-wrap; line-height: 1.8;"></div>
                <div style="margin-top: 1rem; display: flex; gap: 1rem; flex-wrap: wrap;">
                    <button class="btn btn-secondary" onclick="copyText()">
                        <i class="fas fa-copy"></i> نسخ النص
                    </button>
                    <button class="btn btn-secondary" onclick="downloadText()">
                        <i class="fas fa-download"></i> تحميل كملف
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let currentText = '';
        let mediaRecorder;
        let audioChunks = [];
        let selectedFile = null;
        
        function getApiKey() {
            const keys = JSON.parse(localStorage.getItem('apiKeys') || '{}');
            return keys.openai || null;
        }
        
        function previewAudio(input) {
            if(input.files && input.files[0]) {
                selectedFile = input.files[0];
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('audioPlayer').src = e.target.result;
                    document.getElementById('audioPreview').style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
            }
        }
        
        async function convertToText() {
            if(!selectedFile && audioChunks.length === 0) {
                alert('⚠️ يرجى اختيار ملف صوتي أو التسجيل أولاً');
                return;
            }
            
            const apiKey = getApiKey();
            if(!apiKey) {
                alert('⚠️ يرجى إدخال مفتاح API الخاص بـ OpenAI في صفحة الإعدادات أولاً');
                window.location.href = '../settings.html';
                return;
            }
            
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').style.display = 'none';
            
            try {
                let audioBase64;
                
                if(selectedFile) {
                    audioBase64 = await fileToBase64(selectedFile);
                } else if(audioChunks.length > 0) {
                    const audioBlob = new Blob(audioChunks, {type: 'audio/wav'});
                    audioBase64 = await blobToBase64(audioBlob);
                }
                
                const response = await fetch('/api/speech-to-text', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        audioBase64: audioBase64,
                        apiKey: apiKey
                    })
                });
                
                const data = await response.json();
                document.getElementById('loading').style.display = 'none';
                
                if(data.error) {
                    alert('❌ ' + data.error);
                } else {
                    currentText = data.text;
                    document.getElementById('transcribedText').innerHTML = currentText.replace(/\n/g, '<br>');
                    document.getElementById('result').style.display = 'block';
                }
            } catch(error) {
                document.getElementById('loading').style.display = 'none';
                alert('❌ حدث خطأ في تحويل الصوت إلى نص');
            }
        }
        
        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
        
        function blobToBase64(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onload = () => resolve(reader.result.split(',')[1]);
                reader.onerror = error => reject(error);
            });
        }
        
        async function startRecording() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                audioChunks = [];
                
                mediaRecorder.ondataavailable = event => {
                    audioChunks.push(event.data);
                };
                
                mediaRecorder.start();
                document.getElementById('recordBtn').style.display = 'none';
                document.getElementById('stopBtn').style.display = 'inline-block';
            } catch(error) {
                alert('❌ لا يمكن الوصول إلى الميكروفون. تأكد من منح الإذن.');
            }
        }
        
        function stopRecording() {
            mediaRecorder.stop();
            document.getElementById('recordBtn').style.display = 'inline-block';
            document.getElementById('stopBtn').style.display = 'none';
            alert('✅ تم التسجيل بنجاح! يمكنك الآن الضغط على "تحويل إلى نص"');
        }
        
        function copyText() {
            navigator.clipboard.writeText(currentText);
            alert('✅ تم نسخ النص إلى الحافظة');
        }
        
        function downloadText() {
            const blob = new Blob([currentText], {type: 'text/plain'});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `transcribed-text-${Date.now()}.txt`;
            link.click();
            URL.revokeObjectURL(link.href);
        }
    </script>
    <script src="../js/theme.js"></script>
</body>
</html>
