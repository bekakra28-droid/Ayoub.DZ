<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الدردشة الذكية | يعقوب AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <i class="fas fa-robot"></i>
                يعقوب <span>AI</span>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html"><i class="fas fa-home"></i> الرئيسية</a></li>
                <li><a href="../dashboard.html"><i class="fas fa-th-large"></i> الأدوات</a></li>
                <li><a href="../settings.html"><i class="fas fa-cog"></i> الإعدادات</a></li>
            </ul>
            <button class="theme-toggle" id="themeToggle">
                <i class="fas fa-moon"></i>
            </button>
        </div>
    </nav>

    <div class="container">
        <h1><i class="fas fa-comments"></i> الدردشة الذكية</h1>
        
        <div class="chat-container">
            <div class="model-selector" style="padding: 1rem; border-bottom: 1px solid var(--border); display: flex; gap: 1rem; align-items: center; flex-wrap: wrap;">
                <label>🤖 النموذج:</label>
                <select id="modelSelect" style="width: auto; flex: 1;">
                    <option value="gpt-3.5-turbo">GPT-3.5 Turbo (سريع)</option>
                    <option value="gpt-4">GPT-4 (متقدم - إذا كان متاحاً)</option>
                </select>
                <button class="btn btn-secondary" onclick="clearChat()" style="margin-right: auto;">
                    <i class="fas fa-trash"></i> مسح المحادثة
                </button>
            </div>
            
            <div class="chat-messages" id="chatMessages">
                <div class="message ai-message">
                    <div class="message-content">
                        👋 مرحباً! أنا مساعدك الذكي. كيف يمكنني مساعدتك اليوم؟<br>
                        يمكنك سؤالي عن أي شيء - الكتابة، البرمجة، الترجمة، الأفكار، وأكثر!
                    </div>
                </div>
            </div>
            
            <div class="chat-input-area">
                <input type="text" id="messageInput" placeholder="اكتب رسالتك هنا..." onkeypress="handleKeyPress(event)">
                <button class="btn btn-primary" onclick="sendMessage()">
                    <i class="fas fa-paper-plane"></i> إرسال
                </button>
            </div>
        </div>
    </div>

    <script>
        let currentModel = 'gpt-3.5-turbo';
        
        function getApiKey() {
            const keys = JSON.parse(localStorage.getItem('apiKeys') || '{}');
            return keys.openai || null;
        }
        
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if(!message) return;
            
            const apiKey = getApiKey();
            if(!apiKey) {
                alert('⚠️ يرجى إدخال مفتاح API الخاص بـ OpenAI في صفحة الإعدادات أولاً');
                window.location.href = '../settings.html';
                return;
            }
            
            // Add user message to chat
            addMessage(message, 'user');
            input.value = '';
            input.disabled = true;
            
            // Show loading indicator
            const loadingId = addLoadingMessage();
            
            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        apiKey: apiKey,
                        model: currentModel
                    })
                });
                
                const data = await response.json();
                removeLoadingMessage(loadingId);
                input.disabled = false;
                input.focus();
                
                if(data.error) {
                    addMessage('❌ ' + data.error, 'ai');
                } else {
                    addMessage(data.response, 'ai');
                    saveToHistory(message, data.response);
                }
            } catch(error) {
                removeLoadingMessage(loadingId);
                input.disabled = false;
                addMessage('❌ حدث خطأ في الاتصال بالخادم. تأكد من تشغيل الخادم.', 'ai');
            }
        }
        
        function addMessage(content, sender) {
            const messagesDiv = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message fade-in`;
            messageDiv.innerHTML = `<div class="message-content">${formatMessage(content)}</div>`;
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
        
        function formatMessage(content) {
            // Convert newlines to <br>
            return content.replace(/\n/g, '<br>');
        }
        
        function addLoadingMessage() {
            const messagesDiv = document.getElementById('chatMessages');
            const id = 'loading-' + Date.now();
            const loadingDiv = document.createElement('div');
            loadingDiv.id = id;
            loadingDiv.className = 'message ai-message';
            loadingDiv.innerHTML = `<div class="message-content"><div class="spinner" style="width: 30px; height: 30px;"></div> جاري التفكير...</div>`;
            messagesDiv.appendChild(loadingDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
            return id;
        }
        
        function removeLoadingMessage(id) {
            const element = document.getElementById(id);
            if(element) element.remove();
        }
        
        function saveToHistory(userMessage, aiResponse) {
            let history = JSON.parse(localStorage.getItem('chatHistory') || '[]');
            history.push({
                user: userMessage,
                ai: aiResponse,
                timestamp: new Date().toISOString(),
                model: currentModel
            });
            if(history.length > 50) history = history.slice(-50);
            localStorage.setItem('chatHistory', JSON.stringify(history));
        }
        
        function clearChat() {
            if(confirm('هل تريد مسح جميع رسائل المحادثة؟')) {
                const messagesDiv = document.getElementById('chatMessages');
                messagesDiv.innerHTML = `
                    <div class="message ai-message">
                        <div class="message-content">
                            👋 مرحباً! تم مسح المحادثة. كيف يمكنني مساعدتك؟
                        </div>
                    </div>
                `;
            }
        }
        
        function handleKeyPress(event) {
            if(event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendMessage();
            }
        }
        
        document.getElementById('modelSelect').addEventListener('change', (e) => {
            currentModel = e.target.value;
        });
        
        // Focus input on load
        document.getElementById('messageInput').focus();
    </script>
    <script src="../js/theme.js"></script>
</body>
</html>
